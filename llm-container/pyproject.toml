[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "aura-llm"
version = "0.1.0"
description = "Aura LLM microservice for response generation"
authors = [
    {name = "Aura Team", email = "placeholder@aura.com"},
]
requires-python = ">=3.10"
dependencies = [
    "flask>=2.0.0",
    "llama-cpp-python>=0.3.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "black>=22.0.0",
    "flake8>=4.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/aura_llm"]
