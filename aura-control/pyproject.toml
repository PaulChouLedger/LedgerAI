[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "aura-control"
version = "0.1.0"
description = "Aura Control microservice - main orchestrator for voice assistant"
authors = [
    {name = "Aura Team", email = "placeholder@aura.com"},
]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "PyQt5>=5.15.0",
    "torch>=2.0.0",
    "numpy>=1.26.0",
    "soundfile>=0.12.0",
    "sounddevice>=0.4.0",
    "requests>=2.28.0",
    "python-dotenv>=1.0.0",
    "elevenlabs>=0.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "black>=22.0.0",
    "flake8>=4.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/aura_control"]
