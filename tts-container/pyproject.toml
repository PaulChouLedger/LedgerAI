[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "aura-tts"
version = "0.1.0"
description = "Aura TTS microservice for text-to-speech"
authors = [
    {name = "Aura Team", email = "placeholder@aura.com"},
]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "flask>=2.0.0",
    "soundfile>=0.12.0",
    "python-dotenv>=1.0.0",
    "requests>=2.28.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "black>=22.0.0",
    "flake8>=4.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/aura_tts"]
