services:
  whisper:
    build: ./whisper-container
    network_mode: host
    volumes:
      - ./shared:/shared
      - ./whisper-container/cache:/app/cache  # Mount whisper model cache

  llm:
    image: aura-llm-rag
    network_mode: host
    volumes:
      - ./shared:/shared
      - ./data:/app/data  # Mount embeddings data
    working_dir: /app

