[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "aura-whisper"
version = "0.1.0"
description = "Aura Whisper microservice for speech-to-text"
authors = [
    {name = "Aura Team", email = "placeholder@aura.com"},
]
requires-python = ">=3.10"
dependencies = [
    "flask>=2.0.0",
    "soundfile>=0.12.0",
    "numpy>=1.26.0",
    "scipy>=1.11.0",
    "openai-whisper @ git+https://github.com/openai/whisper.git",
    "whisper_trt @ git+https://github.com/NVIDIA-AI-IOT/whisper_trt.git"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "black>=22.0.0",
    "flake8>=4.0.0",
]

[tool.uv.extra-build-dependencies]
whisper-trt = [
    "setuptools",
    "psutil",
    "openai-whisper @ git+https://github.com/openai/whisper.git",
]

[tool.hatch.build.targets.wheel]
packages = ["src/aura_whisper"]
