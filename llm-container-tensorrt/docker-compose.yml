version: '3.8'

services:
  llm-tensorrt:
    build:
      context: ./llm-container-tensorrt
      dockerfile: Dockerfile
    container_name: llm-tensorrt-1
    ports:
      - "11435:11434"  # Different port to avoid conflict with existing llm container
    volumes:
      - ./models:/models:ro  # Mount models directory
      - ./shared:/app/shared:rw  # Shared directory for input/output
    environment:
      - CUDA_VISIBLE_DEVICES=0
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    restart: unless-stopped
    networks:
      - aura-network

networks:
  aura-network:
    external: true
