services:
  whisper:
    build: ../containers/whisper
    network_mode: host
    runtime: nvidia
    volumes:
      - ../shared:/shared
      - ../containers/whisper/container_rest.py:/app/container_rest.py:ro
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
      - WHISPER_MODEL=${WHISPER_MODEL:-distil-whisper/distil-large-v3.5-ct2}

  memory:
    build: ../containers/memory
    network_mode: host
    runtime: nvidia
    volumes:
      - ../shared:/shared
      - ../data:/app/data
      - ../.env:/app/.env
    working_dir: /app
    env_file: ../.env
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
      - WHISPER_SERVICE_URL=http://localhost:5000
      - LLM_SERVICE_URL=http://localhost:11434
      - MEMORY_DIR=/app/data/memory
      - AUDIO_DEVICE_NAME=reSpeaker
      - PORT=11438
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
