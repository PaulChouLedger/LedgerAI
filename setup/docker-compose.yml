services:
  whisper:
    build: ../whisper-container
    network_mode: host
    runtime: nvidia
    volumes:
      - ../shared:/shared
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility

  llm-medical:
    build: ../llm-medical-container
    network_mode: host
    runtime: nvidia
    volumes:
      - ../shared:/shared
      - ../data:/app/data
      - ../.env:/app/.env
    working_dir: /app
    env_file: ../.env
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility

  llm-generic:
    build: ../llm-container
    network_mode: host
    runtime: nvidia
    volumes:
      - ../shared:/shared
      - ../data:/app/data
      - ../.env:/app/.env
    working_dir: /app
    env_file: ../.env
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility

  # Wyoming OpenWakeWord service (Jetson-optimized)
  wyoming-openwakeword:
    image: dustynv/wyoming-openwakeword:r36.2.0
    network_mode: host
    runtime: nvidia
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
    command: --uri tcp://0.0.0.0:10400
    restart: unless-stopped

