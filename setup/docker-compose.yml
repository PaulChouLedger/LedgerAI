services:
  whisper:
    build: ../whisper-container
    network_mode: host
    volumes:
      - ../shared:/shared

  llm:
    build: ../llm-medical-container
    network_mode: host
    volumes:
      - ../shared:/shared
      - ../data:/app/data
      - /home/aura/LedgerAI/.env:/app/.env
    working_dir: /app
    environment:
      - LLM_TEMPERATURE_COMPLEX=0.05
      - LLM_TEMPERATURE_SIMPLE=0.2
      - MODEL_PATH=/models/Mistral-7B-Instruct-v0.3.Q4_K_M.gguf
      - SIMPLE_MODEL_PATH=/models/Llama-3.2-1B-Instruct-Q4_K_M.gguf
      - N_CTX=4096
      - SIMPLE_N_CTX=2048
      - EHR_INTEGRATION_ENABLED=false
      - TEST_VAR=hello

  rag:
    build: ../rag-container
    network_mode: host
    volumes:
      - ../shared:/shared
      - ../data:/app/data  # Mount embeddings data
      - ../rag-container/cache:/app/cache  # Mount RAG model cache
    working_dir: /app
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
