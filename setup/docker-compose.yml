services:
  whisper:
    build: ../whisper-container
    network_mode: host
    runtime: nvidia
    volumes:
      - ../shared:/shared
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
      # NOTE: Default value should match MODEL_NAME default in whisper-container/container_rest.py
      # The actual value is set by main.py from state.py, which reads from container_rest.py
      # This is only a fallback if WHISPER_MODEL env var is not set
      - WHISPER_MODEL=${WHISPER_MODEL:-distil-whisper/distil-large-v3.5-ct2}

  llm-medical:
    build: ../llm-medical-container
    network_mode: host
    runtime: nvidia
    volumes:
      - ../shared:/shared
      - ../data:/app/data
      - ../.env:/app/.env
      - ../llm-container/models:/models
    working_dir: /app
    env_file: ../.env
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
      - SIMPLE_MODEL_PATH=/models/Qwen2.5-7B-Instruct-Q4_K_M.gguf
      - SIMPLE_CHAT_FORMAT=chatml
      - SIMPLE_N_CTX=16384
      - LLM_STOP=<|im_end|>

  llm-generic:
    build: ../llm-container
    network_mode: host
    runtime: nvidia
    volumes:
      - ../shared:/shared
      - ../data:/app/data
      - ../.env:/app/.env
      - ../llm-container/container_rest.py:/app/container_rest.py
      - ../llm-container/models:/models
    working_dir: /app
    env_file: ../.env
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
      - SHOW_REASONING_DEBUG=false
      - BASE_MODEL_PATH=/models/Qwen2.5-7B-Instruct-Q4_K_M.gguf
      - COT_MODEL_PATH=/models/Qwen2.5-7B-Instruct-Q4_K_M.gguf
      - SIMPLE_MODEL_PATH=/models/Qwen2.5-7B-Instruct-Q4_K_M.gguf
      - SIMPLE_N_CTX=16384

  memory:
    build: ../memory-container
    network_mode: host
    runtime: nvidia
    volumes:
      - ../shared:/shared
      - ../data:/app/data
      - ../.env:/app/.env
    working_dir: /app
    env_file: ../.env
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
      - WHISPER_SERVICE_URL=http://localhost:5000
      - LLM_SERVICE_URL=http://localhost:11434
      - MEMORY_DIR=/app/data/memory
      - AUDIO_DEVICE_NAME=reSpeaker
      - PORT=11438
      - LOG_LEVEL=${LOG_LEVEL:-INFO}  # Set to DEBUG for detailed logging
    # Note: Audio device access may require additional permissions
    # If audio conflicts occur, disable background listener and use API-based transcription forwarding
    # To enable debug logging: LOG_LEVEL=DEBUG docker-compose up memory

  chatterbox-tts:
    build: ../chatterbox-container
    network_mode: host
    runtime: nvidia
    volumes:
      - ../shared:/shared
      - ../assets/voice_samples:/app/voice_samples
      - ../assets/prompts:/app/prompts
      - ../data/voice_cache:/app/voice_cache
      - ../.env:/app/.env
    working_dir: /app
    env_file: ../.env
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility

