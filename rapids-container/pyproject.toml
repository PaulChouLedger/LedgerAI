[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "aura-rapids"
version = "0.1.0"
description = "Aura RAPIDS microservice for vector search and RAG"
authors = [
    {name = "Aura Team", email = "placeholder@aura.com"},
]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "flask>=2.0.0",
    "numpy>=1.26.0",
    "cudf-cu12>=24.0.0",
    "cuml-cu12>=24.0.0",
    "cuvs-cu12>=24.0.0",
    "transformers>=4.30.0",
    "torch>=2.0.0",
    "llama-index>=0.9.0",
    "pydantic>=2.0.0",
    "beautifulsoup4>=4.11.0",
    "lxml>=4.9.0",
    "requests>=2.28.0",
    "pdfminer.six>=20221105",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "black>=22.0.0",
    "flake8>=4.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/aura_rapids"]
